# Local PostgreSQL and Qdrant for development: docker compose up -d
name: sensormind

services:
  postgres:
    image: postgres:17.5
    environment:
      POSTGRES_USER: sensormind
      POSTGRES_PASSWORD: sensormind
      POSTGRES_DB: sensormind
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.17.0
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  postgres-data:
  qdrant-data:
